# quality-gates.yml — 静的評価レイヤーの言語プロファイル
#
# 設計（3 層モデル）:
#   ① 何を測るか（特性→指標）        = references/ で定義（ISO/IEC 25010 由来・言語非依存・共通）
#   ② どう測るか（指標→ツール/しきい値） = このファイル（言語ごとの "プロファイル"。ここだけ言語依存）
#   ③ 判定・スコアカード化              = quality-review スキルが機械的に実施（共通）
#
# 使い方: quality-review スキルが対象言語を検出し、該当プロファイルの
#   - deterministic: 実在ツールを実行 → 生の数値をしきい値と機械的に突き合わせ（AI 判断ゼロ＝決定論パート）
#   - judgment:      ツール未成熟/本質的に主観な領域。AI/人手で評価し「推測」ラベルを付す（考察パート）
#
# 新しい言語を使うときは、その言語の profile を末尾に追記するだけ（references は共通のまま）。
# しきい値はプロジェクト方針に合わせて調整可。出典はしきい値ごとに異なるため、各 threshold 行の
# コメントに出典種別を明記する（ツール既定 / プラグイン方針 / プロジェクト上書き）。
#   - ツール既定:      当該ツールが同じ値を既定で持つ（例: SwiftLint の rule 既定値）
#   - プラグイン方針:  ツール既定が存在せず、本プラグインが選んだ値
#   - プロジェクト上書き: 採用プロジェクトが自分の方針で調整すべき値

version: 1

swift:
  # 環境にツールが無い場合は「未実行（skipped）」と報告すること。数値を捏造しない。
  # スキル本体はツールを自動インストールしない（サプライチェーン保護のため明示同意を要する）。
  setup:
    # 注意: 下記は導入ツールの一覧であり、推奨インストール経路ではない。
    #   - 各ツールはプロジェクトの方針（バージョン pin / 配布元検証 / 監査済み tap のみ）に従って導入すること。
    #   - 特に `peripheryapp/periphery` は homebrew-core ではなく third-party tap。
    #     tap の追加は formula 供給源を恒久的に増やすため、組織のセキュリティ方針に従い別途承認すること。
    #   - CI で導入する場合は `actions/cache` でのバージョン pin と SHA 検証を推奨。
    required_tools:
      - swiftlint        # homebrew-core
      - swift-format     # homebrew-core
      - lizard           # homebrew-core
      - trivy            # homebrew-core
      - jscpd            # homebrew-core（任意）
      - periphery        # third-party tap (peripheryapp/periphery) — 別途方針確認
  # 結合の深掘り (references/07a-coupling-deep-dive.md) のための module 単位宣言。
  # `distance_level` 決定論計算の前提（07a §9 H4）。
  # 未宣言時は distance basis: path-depth fallback ラベル併記が必須。
  module_unit: spm-target          # 例: "spm-target", "spm-product", "directory:Sources/<dir>"
  deterministic:
    functional_suitability:
      - id: test-coverage
        metric: ライン/リージョン カバレッジ
        ref: "ISO/IEC 25023"
        run: "swift test --enable-code-coverage"
        report: |
          macOS:  xcrun llvm-cov report .build/debug/<Pkg>PackageTests.xctest/Contents/MacOS/<Pkg>PackageTests \
                    -instr-profile .build/debug/codecov/default.profdata
          Linux:  llvm-cov report .build/debug/<Pkg>PackageTests.xctest \
                    -instr-profile .build/debug/codecov/default.profdata
        threshold: { min: 0.70 }        # 出典: プロジェクト上書き（規格由来ではない）。下回ったら severity=high
    maintainability:
      - id: cyclomatic-complexity
        metric: 関数あたりの循環的複雑度
        ref: "McCabe (1976) IEEE TSE; ISO/IEC 25023"
        run: "swiftlint lint --quiet --reporter json"     # rule: cyclomatic_complexity
        fallback: "lizard --languages swift -w"
        threshold: { high: 10, critical: 20 }             # 出典: ツール既定（SwiftLint cyclomatic_complexity warning/error）
      - id: function-body-length
        ref: "ISO/IEC 25010 解析性/修正性"
        run: "swiftlint lint --quiet --reporter json"     # rule: function_body_length
        threshold: { high: 50, critical: 100 }            # 行。出典: ツール既定（SwiftLint function_body_length）
      - id: type-body-length
        run: "swiftlint lint --quiet --reporter json"     # rule: type_body_length
        threshold: { high: 250, critical: 350 }           # 出典: ツール既定（SwiftLint type_body_length）
      - id: file-length
        run: "swiftlint lint --quiet --reporter json"     # rule: file_length
        threshold: { high: 400, critical: 1000 }          # 出典: ツール既定（SwiftLint file_length）
      - id: dead-code
        metric: 未使用宣言（モジュール性/解析性）
        run: "periphery scan --quiet"
        threshold: { max: 0 }                             # 出典: プラグイン方針（Periphery に既定しきい値はない）
      - id: format-conformance
        metric: 整形規約逸脱（一意・完全に決定論的）
        run: "swift-format lint --recursive Sources/ Tests/"   # 代替: swiftformat --lint .
        threshold: { violations_max: 0 }                  # 出典: ツール既定（lint = 逸脱ゼロが規約準拠）
    security:
      - id: dependency-vulnerabilities
        metric: SPM 依存に含まれる既知 CVE
        ref: "OWASP MASTG-TEST-0085"
        run: "trivy fs --scanners vuln --quiet ."          # Package.resolved を走査
        threshold: { critical: 0, high: 0 }               # 出典: プラグイン方針（Trivy 側の既定ではない）
        note: >
          Trivy / OWASP Dependency-Check の SPM 対応は experimental。
          0 件でも見落としがあり得るため judgment 側でも補完する。
  # 結合の深掘り (07a 補論) シグナル。`deterministic:` と区別される EXPERIMENTAL ブロック。
  # - experimental: true。verdict 確定権を持たない。既存 deterministic: の PASS/FAIL を上書きしない。
  #   寄与できるのは severity の下方修正のみ (07a §9 H9)。既定では考察パートの所見 attach に閉じる。
  # - 生成された数値は 推測 ラベル付きで採用 (静的評価 §3.6.4)。
  # - ツール未導入時は skipped (数値捏造禁止)。
  # - Strength ラダー段は 07a §6.5 hint table が "候補" を出すのみ。段の確定は人手レビューに委譲
  #   (本ブロックは "候補絞り込みの入力" であって段の確定ではない / 07a §3.2 / §9 H3)。
  # - aggregate スコアを単独 verdict 根拠に使わない (07a §3.2 / H2)。
  # - deterministic: への昇格は静的評価 §3.6.4 の 3 条件 + ユーザ明示同意が揃った時のみ (現時点未達)。
  # - 昇格方針 (書籍原典確認済み): band severity の数値閾値は Khononov 原典に根拠なし
  #   (Ch.7 図7.14 / Ch.8 図8.2 / Ch.9 表9.1 は順序的・質的、§10.3「正確な科学ではない」)。
  #   閾値は リポジトリ運用上の選択 であり、本ブロックを deterministic: へ昇格しないのが既定方針
  #   (静的評価 §3.6.4)。例外は 2値境界 intrusive_hits>0 (常に override, 07a §6.5)。
  planned-deterministic:
    experimental: true                 # Phase 2 試作。安定化まで考察パート attach に限定。
    coupling:
      - id: distance-level
        metric: 2 部品間の Khononov Distance 段（1=Methods → 5=Systems、07a §4）
        ref: "Khononov 2024, Ch.8 / 07a §4 / 07a §9 H4"
        module_unit_required: true                            # spm-target 単位で計算
        run: "swift package describe --type json"             # 出力からモジュール境界を抽出
        post_process: "scripts/coupling-gate-swift.sh --signal distance"
        threshold:
          bands:
            - { max: 1, label: "intra-method",     severity: info }
            - { max: 2, label: "intra-object",     severity: info }
            - { max: 3, label: "intra-namespace",  severity: info }
            - { max: 4, label: "cross-service",    severity: medium }
            - { max: 5, label: "cross-system",     severity: high }
        note: >
          module_unit: 未宣言の場合は計算せず、結果に
          `distance basis: path-depth fallback` ラベルを付与する。
      - id: volatility-proxy
        metric: モジュール変更頻度 proxy (observed_change_frequency)
        ref: "Khononov 2024, Ch.9 / 07a §5 / 07a §9 H5"
        observation_window: "--since=6.months"               # 本文に必ず併記
        run: "git log --since=6.months --pretty=format: --name-only | sort | uniq -c | sort -rn"
        fallback: "code-maat -l <git.log> -c svn"             # code-maat 利用時
        post_process: "scripts/coupling-gate-swift.sh --signal volatility"
        threshold:
          bands:
            - { max: 5,   label: "stable",     severity: info }
            - { max: 20,  label: "moderate",   severity: info }
            - { max: 100, label: "volatile",   severity: medium }
            - { max: null, label: "hot-spot",  severity: high }
        note: >
          observed_change_frequency は Khononov Volatility の proxy であり、BALANCE 判定での
          採用時は 推測 ラベル必須 (07a §5.3 / H5)。観測ウィンドウは本文併記必須。
          計測はモジュール (module_unit) 単位の pathspec で行う。リポジトリ全体のコミット数を
          単一モジュールの変更頻度として帰属させない。
      - id: intrusive-hits
        metric: モジュール境界を跨ぐ private/internal シンボル参照件数
        ref: "Khononov 2024, Ch.7 / 07a §3 / 07a §9 H3"
        # 注意: 汎用 semgrep ruleset (p/swift) は lint/security 指摘の集合であり、クロスモジュール
        #       private/internal アクセス検出ルールを含まないため、その件数を本シグナルに計上しない。
        #       専用のクロスバウンダリルール (モジュール帰属付き) が整備できた時点で run に昇格させる。
        run: "scripts/coupling-gate-swift.sh --signal intrusive"   # ripgrep による @testable import 検出
        threshold:
          bands:
            - { max: 0, label: "clean",    severity: info }
            - { max: 5, label: "watch",    severity: high }
            - { max: null, label: "intrusive", severity: critical }
        note: >
          intrusive_hits > 0 は BALANCE モデル (07a §6) で常に最先頭の override 句となる
          (どれだけ Distance / Volatility が良くても Intrusive は FAIL)。
          07a §6.5 hint table 参照。
      - id: cross-boundary-duplicates
        metric: モジュール境界を跨ぐ重複コードブロック数
        ref: "Khononov 2024, Ch.7 (Functional Coupling) / 07a §3"
        run: "jscpd --reporters json --silent ."
        threshold:
          bands:
            - { max: 0,  label: "none",        severity: info }
            - { max: 3,  label: "watch",       severity: medium }
            - { max: null, label: "functional", severity: high }
        note: >
          cross-module 重複は Functional Coupling の主要シグナル。
          共有要素 (重複コード対の path:line) を併記しない断定は禁則 (H3)。
      - id: shared-model-surface
        metric: モジュール境界を越えて公開される共有モデル型数
        ref: "Khononov 2024, Ch.7 (Model Coupling) / 07a §3"
        run: "swift package describe --type json"             # public type の境界跨ぎ抽出
        post_process: "scripts/coupling-gate-swift.sh --signal shared-model"
        threshold:
          bands:
            - { max: 0,   label: "contract-only", severity: info }
            - { max: 10,  label: "model-low",     severity: info }
            - { max: null, label: "model-heavy",  severity: medium }
        note: >
          DTO 専用なら "model-low"、ドメインロジック付き型なら 1 件でも "model-heavy" 扱い。
          07a §6.5 hint table のラダー割当入力。
    aggregate:
      # リポジトリ全体の概観目的のみ。verdict 根拠に単独で使わない。
      - id: balance-pairs-ratio
        metric: BALANCE = TRUE となるモジュール対の割合
        ref: "Khononov 2024, Ch.10 / 07a §6.1"
        formula: "count(STRENGTH XOR DISTANCE OR NOT VOLATILITY) / count(all_module_pairs)"
        post_process: "scripts/coupling-gate-swift.sh --aggregate balance"
        threshold: { min: 0.7 }                              # 概観しきい値、verdict 根拠不可
        # 実装状況: per-pair の signal 計測が未実装のため、post_process は比率を出力しない。
        #   現状は 2値化した worst-case 入力で式を評価した `balance-worst-case`
        #   (indicative-true/false) を出力し、pairs_ratio: not-computed を明示する。
        note: >
          aggregate スコアは Khononov 2024 が名指しで否定する "count-based" 系メトリクスに近い。
          概観目的 (dashboard 表示等) に限定し、指摘の severity 根拠としては引用しない (H2)。
          BALANCE 各次元の core SIGNAL (distance-level / volatility-proxy / intrusive-hits) が
          一つでも skipped の場合、aggregate は `indicative-true` を出さず `inconclusive (missing:...)`
          を返す (skipped を pass と誤読させない)。
  judgment:
    # 静的ツールが未成熟、または本質的に主観/動的。AI/人手で評価し「推測」を明示。
    security:
      - "SAST 深掘り（機密性・真正性・否認防止性）: Semgrep(--config auto, Swift は experimental) / SWAN / OWASP MASVS-MASTG / MobSF を参考に人手評価"
    reliability:
      - "成熟性・障害許容性・回復性は XCTest / Instruments 等の動的検証。静的ゲート対象外"
    performance_efficiency:
      - "時間/資源効率は Instruments・XCTest measure 等の動的計測。静的ゲート対象外"
    usability:
      - "UI 快美性・習得性・適切度認識性は静的化不可。アクセシビリティは Accessibility Inspector で別途"
    compatibility:
      - "相互運用性/後方互換は契約テスト・スキーマ差分で別途（言語非依存ツール）"
    portability:
      - "適応性・置換性は設計レビュー。設置性は CI 上の clean-build 再現性で補助確認"
    coupling_deep_dive:
      # 07a 補論で 判断のみ と分類される項目。BALANCE 適用時は 推測 ラベル必須。
      - "Khononov Integration Strength 段 (Intrusive/Functional/Model/Contract) の確定: 共有要素 (symbol/type/contract path) 併記が必須 (H3)。SIGNAL は planned-deterministic で計測するが、段の確定は 07a §6.5 hint table（候補提示）+ 人手レビューに委譲"
      - "動的 Connascence (CoE/CoTi/CoV/CoI) は静的シグナルだけで断定不可 (H6)。runtime 観測・並行性解析の参照を併記し 推測 ラベル付与"
      - "Socio-Technical Distance (Conway's Law 整合): CODEOWNERS / git author 分布から概観可能だが組織判断との突合せが必須"
      - "Volatility の essential vs accidental 区別 (07a §5.2): 業務由来 (essential) と設計起因 (accidental) の切り分けはドメイン理解必須"

# go:        # 例: 使う言語が増えたらここに追記（references は共通のまま）
