name: "✨ 改善・機能要望 / Feature request"
description: 新機能の提案や既存機能の改善を起票します。
title: "[Feature] <簡潔なタイトルを記入>"
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## 提案ありがとうございます 💡

        実装の検討に入れるよう、「**何を解決したいか（課題）**」と「**どう解決したいか（提案）**」を分けて記入してください。
        投稿前に [既存の Issue](../issues?q=is%3Aissue) を検索し、重複がないか確認してください。

  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 既存の Issue / Discussion を検索し、重複がないことを確認した。
          required: true

  - type: dropdown
    id: plugin
    attributes:
      label: 対象プラグイン
      description: 提案の対象となるプラグインを選択してください。
      options:
        - tech-docs
        - quality-architect
        - marketplace 全体 / リポジトリ運用
        - 新規プラグインの提案
        - その他・横断的
    validations:
      required: true

  - type: input
    id: skill
    attributes:
      label: 対象の Skill / コマンド
      description: 関連する Skill やコマンドがあれば記入してください。
      placeholder: "例: quality-review"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題・背景
      description: |
        どんな場面で困っているか、なぜこの改善が必要かを説明してください。
        「〜のとき、〜できなくて困っている」という形式が書きやすいです。
      placeholder: "例: ADR を生成する際に既存のテンプレートを差し替えられず、社内フォーマットに合わせられない。"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策
      description: 期待する挙動や具体的な実装イメージがあれば記載してください。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 他に考えた方法や、現状の回避策があれば記載してください。
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影響範囲の想定
      description: あくまで目安で構いません。
      options:
        - 小 (ドキュメント / 文言 / 軽微な調整)
        - 中 (既存 Skill の挙動変更)
        - 大 (新規 Skill / 破壊的変更を含む)
        - 不明
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 補足情報
      description: 参考リンク、モックアップ、サンプル出力などがあれば添付してください。
    validations:
      required: false
