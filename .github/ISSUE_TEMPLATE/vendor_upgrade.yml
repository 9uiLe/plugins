name: "📦 Vendor アップグレード (Prism / Mermaid)"
description: tech-docs プラグインに同梱している Prism / Mermaid (vendor 配下) のバージョン追従用テンプレート。
title: "[Vendor] <YYYY-QN> Prism / Mermaid バージョン確認"
labels: ["maintenance", "vendor", "tech-docs"]
body:
  - type: markdown
    attributes:
      value: |
        ## 目的

        ADR-0002 で決定したとおり、tech-docs プラグインは Prism / Mermaid を `shared-assets/vendor/` 配下に同梱しており、
        npm の自動依存スキャナ (Dependabot 等) が効かない。

        **四半期に 1 回**、上流の新バージョン・CVE 情報を確認し、必要なら本テンプレートに沿ってアップグレード PR を作成する。

        - 関連 ADR: `docs/adr/0002-vendor-prism-mermaid.html`
        - CVE データベース: <https://github.com/advisories>

  - type: checkboxes
    id: current-versions
    attributes:
      label: 現行バージョン (確認時点)
      description: |
        `plugins/tech-docs/shared-assets/vendor/SHA256SUMS` と各ファイルから現在の同梱バージョンを確認してください。
      options:
        - label: "Prism: 1.29.0 のままである"
        - label: "Mermaid: 10.9.1 のままである"

  - type: textarea
    id: upstream-latest
    attributes:
      label: 上流の最新バージョン
      description: |
        以下を埋めてください。
        ```bash
        npm view prismjs version
        npm view mermaid version
        ```
      value: |
        - Prism latest:
        - Mermaid latest:
        - 差分: (パッチ / マイナー / メジャー / 同一)
    validations:
      required: true

  - type: textarea
    id: cve-check
    attributes:
      label: CVE / セキュリティアドバイザリ確認
      description: |
        - <https://github.com/advisories?query=prismjs>
        - <https://github.com/advisories?query=mermaid>
      value: |
        - Prism 新規 advisory:
        - Mermaid 新規 advisory:
        - 影響範囲 (該当バージョンを同梱しているか):
    validations:
      required: true

  - type: dropdown
    id: action
    attributes:
      label: 必要なアクション
      options:
        - "アップグレード不要 (このまま close)"
        - "パッチ / マイナー追従 (低リスク・通常 PR)"
        - "メジャー追従 (互換性確認が必要)"
        - "緊急: CVE 該当のため即時アップグレード"
    validations:
      required: true

  - type: textarea
    id: upgrade-checklist
    attributes:
      label: アップグレード PR チェックリスト
      description: 上記が "アップグレード不要" 以外なら実施する。
      value: |
        - [ ] 新バージョンを cdnjs / jsdelivr からダウンロードし、上流公式 SRI と一致を確認
        - [ ] `shared-assets/vendor/` 配下を差し替え
        - [ ] `cd shared-assets/vendor && find . -type f \( -name '*.js' -o -name '*.css' \) -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS` を再生成
        - [ ] ADR-0002 の「採用バージョン」表を更新
        - [ ] CHANGELOG にエントリ追加
        - [ ] CI (verify-vendor) が green
        - [ ] サンプル (showcase.html / adr-sample.html) をブラウザで開いて装飾が機能することを目視確認
    validations:
      required: false
