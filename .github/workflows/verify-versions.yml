name: verify-versions

on:
  pull_request:
    paths:
      - ".claude-plugin/marketplace.json"
      - ".agents/plugins/marketplace.json"
      - "plugins/**/.claude-plugin/plugin.json"
      - "plugins/**/.codex-plugin/plugin.json"
      - "plugins/second-opinion/**"
      - "scripts/**"
      - ".github/workflows/verify-versions.yml"
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck scripts/
        run: |
          shopt -s globstar nullglob
          shellcheck -S warning -x scripts/**/*.sh

      - name: verify-versions
        run: bash scripts/verify-versions.sh

      - name: Test second-opinion
        run: node --test plugins/second-opinion/tests/second-opinion.test.mjs
