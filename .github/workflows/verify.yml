name: verify

# No paths filter: scripts/verify.sh checks inputs across the repository
# (README catalog, marketplaces, plugins, scripts), so a filter would have to
# be kept in sync with every check it runs.
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: command -v shellcheck || brew install shellcheck

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependency
        run: python -m pip install Pillow

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install architecture-explainer dependencies
        working-directory: plugins/architecture-explainer/skills/architecture-explainer
        run: bun ci

      - name: Verify repository
        run: bash scripts/verify.sh
